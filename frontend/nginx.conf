# 文旅创新智脑 · 前端生产站点配置
# 工单编号：人工智能CV-AIGC-20-文旅Agent任务工单-功能集成测试与部署
#
# 与开发环境（vite.config.ts 的 proxy）保持同一套转发约定：
#   1) /api  → 后端，且必须支持 WebSocket 升级（实时感知流 /api/v1/ws/perception）
#   2) 其余路径 → 单页应用回退到 index.html
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 多端适配（docs/06 §4.1）：开启 gzip 让移动网络下首屏更快
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    # 游客照片上传（工单19 纪念内容），与后端 MAX_UPLOAD_BYTES 对齐并留余量
    client_max_body_size 24m;

    # 后端 API 与实时感知 WebSocket
    location /api/ {
        proxy_pass http://backend:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 生成类接口同步模式耗时可达分钟级（图像生成 30~40s、视频合成 5~15s），
        # 这里放宽读超时，避免长任务被网关提前断开
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 关闭缓冲，保证聊天/感知等流式响应即时到达
        proxy_buffering off;
    }

    # 静态资源长缓存（构建产物带内容哈希）
    location ~* \.(?:js|css|png|jpe?g|gif|svg|webp|woff2?|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 单页应用：未命中的路径一律回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
